name: validate-lab

# Validates the lab end-to-end on an amd64 runner (the same architecture as
# Codespaces): bring up the devcontainer compose stack and prove SalesLT.Customer
# returns rows as the student login, with no manual setup — DTA-3's acceptance
# criterion. The VS Code extension UI itself can't be exercised headlessly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE: .devcontainer/docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      # The base image package may be private; same-org GITHUB_TOKEN can pull it.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bring up the lab (waits for mssql to be healthy)
        run: docker compose -f "$COMPOSE" up -d --wait

      - name: SELECT SalesLT.Customer as the student login
        run: |
          cid="$(docker compose -f "$COMPOSE" ps -q mssql)"
          rows="$(docker exec "$cid" sqlcmd -S localhost -U student -P 'Student!Pass123' \
            -C -d AdventureWorksLT -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM SalesLT.Customer;" | tr -dc '0-9')"
          echo "SalesLT.Customer rows: ${rows:-0}"
          test "${rows:-0}" -gt 0

      - name: Tear down
        if: always()
        run: docker compose -f "$COMPOSE" down -v
